# Server stack: frontend (nginx) + backend API + MongoDB single-node replica set.
# Transactions require a replica set, so mongo starts with --replSet and is
# initiated by the healthcheck.
#
# Ports (all bound to 127.0.0.1, so only this machine can reach them):
#   9007  frontend  - open http://localhost:9007 in the browser
#   9008  backend   - the API (the frontend forwards /api to it)
#   9009  database  - MongoDB, for admin tools on this machine only (no password,
#                     so never publish it on 0.0.0.0)
# Live URL: https://neutaracabs.cftools.live — the HTTPS proxy on the host forwards to 127.0.0.1:9007.
name: neutara-cabs-booking

services:
  mongo:
    image: mongo:7.0
    container_name: neutara-cabs-booking-mongo
    hostname: mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "9009"]
    ports: ["127.0.0.1:9009:9009"]
    volumes: ["mongo-data:/data/db"]
    networks: [net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "9009", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:9009'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build: .
    image: neutara-cabs-booking-app:latest
    container_name: neutara-cabs-booking-app
    hostname: app
    depends_on:
      mongo:
        condition: service_healthy
    env_file: server/.env
    environment:
      # Set here so a development server/.env can't switch off the production checks.
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:9009/cab_booking?replicaSet=rs0
      PORT: 9008
      # Requests pass two proxies: the HTTPS proxy for neutaracabs.cftools.live, then the
      # frontend's nginx. Raise this if more proxies are added (e.g. a CDN in front).
      TRUST_PROXY: 2
    ports: ["127.0.0.1:9008:9008"]
    networks: [net]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    build:
      context: .
      target: web
    image: neutara-cabs-booking-web:latest
    container_name: neutara-cabs-booking-web
    hostname: web
    depends_on:
      app:
        condition: service_healthy
    ports: ["127.0.0.1:9007:9007"]
    networks: [net]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  net:
    name: neutara-cabs-booking-net
    # Fixed small range: the server's Docker has no free automatic ranges left.
    # Override with NEUTARA_SUBNET=<cidr> in a .env file next to this file if it clashes.
    ipam:
      config:
        - subnet: ${NEUTARA_SUBNET:-10.207.97.0/28}

volumes:
  mongo-data:
    name: neutara-cabs-booking-mongo-data
