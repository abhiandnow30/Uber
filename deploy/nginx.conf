# Frontend container: serves the built web app and forwards the API and live
# updates to the backend container ("app").
# Live at https://neutaracabs.cftools.live: the HTTPS proxy in front talks plain HTTP
# to this container, so keep the scheme it reports instead of replacing it with "http".
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 9007;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 5m;

    # Same security headers the backend sends for its own responses.
    add_header Content-Security-Policy "default-src 'self';base-uri 'self';font-src 'self' https: data:;form-action 'self' https://login.microsoftonline.com;frame-ancestors 'none';img-src 'self' data:;object-src 'none';script-src 'self';script-src-attr 'none';style-src 'self' 'unsafe-inline';connect-src 'self' ws: wss:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass http://app:9008;
    }

    location /socket.io/ {
        proxy_pass http://app:9008;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Source maps stay private.
    location ~ \.map$ {
        return 404;
    }

    # Built files have content hashes in their names, so they can be cached for long.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
